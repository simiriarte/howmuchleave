<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Bagel Fat One"; src: url("fonts/bagel-fat-one-latin.woff2") format("woff2"); }
html,body { margin:0; }
.card { width:1200px; height:630px; position:relative; overflow:hidden; background: radial-gradient(ellipse at 50% 35%, #26576D 0%, #1E4A5E 60%, #183E50 100%); font-family: "Bagel Fat One", sans-serif; }
.fish { position:absolute; left:120px; top:118px; width:470px; transform: rotate(-4deg); }
h1 { position:absolute; left:620px; top:205px; margin:0; color:#F1ECE2; font-size:104px; font-weight:400; line-height:0.95; }
.weed { position:absolute; bottom:-10px; }
.bubble { position:absolute; border:3px solid rgba(241,236,226,.55); background: rgba(241,236,226,.06); border-radius:50%; }
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- colours are CSS variables so swimming fish can wear other painting colours;
       the defaults are the original fish -->
  <symbol id="fish" viewBox="0 0 120 64">
    <polygon points="94,32 118,8 111,32 118,58" style="fill: var(--fish-tail, #3A8296)"/>
    <polygon points="100,32 114,16 109,32 114,48" style="fill: var(--fish-tail2, #34333A)"/>
    <polygon points="46,12 57,1 72,5 70,14" style="fill: var(--fish-fin, #B83A3C)"/>
    <polygon points="6,34 20,19 46,11 76,14 96,28 97,38 80,51 50,58 21,51" style="fill: var(--fish-body, #DDB27E)"/>
    <polygon points="40,15 70,13 89,27 85,42 62,48 45,38" style="fill: var(--fish-patch, #C6896A)"/>

    <polygon points="12,39 38,44 66,52 49,57 23,51" style="fill: var(--fish-belly, #F1ECE2)"/>
    <polygon points="38,39 52,47 41,51" style="fill: var(--fish-pec, #E2CB3A)"/>
    <polygon points="62,52 72,62 76,51" style="fill: var(--fish-fin, #B83A3C)"/>
    <circle cx="19" cy="31" r="3.4" fill="#F1ECE2"/>
    <circle cx="18.4" cy="31" r="1.7" fill="#34333A"/>
  </symbol>
  <!-- Just the suitcase, for the Potential Trips list -->
  <symbol id="suitcase" viewBox="22 37 48 57">
    <rect x="39.5" y="43" width="2.4" height="16" fill="#C3C8CD"/>
    <rect x="51.5" y="43" width="2.4" height="16" fill="#C3C8CD"/>
    <rect x="37.5" y="40.5" width="18" height="4" fill="#5E5A4E"/>
    <polygon points="25,59 66,58 67,85 26,86" fill="#C6896A"/>
    <polygon points="31,58.8 35,58.7 35.6,85.8 31.6,85.9" fill="#8C4F1F"/>
    <polygon points="56,58.3 60,58.2 60.6,85.2 56.6,85.3" fill="#8C4F1F"/>
    <polygon points="25,59 30,59 25,64" fill="#34333A"/>
    <polygon points="61,58.1 66,58 66.1,63" fill="#34333A"/>
    <polygon points="26,81 26,86 31,86" fill="#34333A"/>
    <polygon points="67,80 67,85 62,85.1" fill="#34333A"/>
    <polygon points="40,66 47,65.4 47.6,71 40.6,71.6" fill="#F1ECE2"/>
    <circle cx="32" cy="89" r="3.6" fill="#1E1D22" stroke="#8E959B" stroke-width="1.2"/><circle cx="32" cy="89" r="1.2" fill="#C3C8CD"/>
    <circle cx="60" cy="88.6" r="3.6" fill="#1E1D22" stroke="#8E959B" stroke-width="1.2"/><circle cx="60" cy="88.6" r="1.2" fill="#C3C8CD"/>
  </symbol>
  <!-- The same fish pulling a rolling suitcase. The handle loops up around the
       fish's belly; the fin wraps over the grip, so it's carrying it. -->
  <symbol id="fish-trip" viewBox="0 0 120 96">
    <polygon points="25,59 66,58 67,85 26,86" fill="#C6896A"/>
    <polygon points="31,58.8 35,58.7 35.6,85.8 31.6,85.9" fill="#8C4F1F"/>
    <polygon points="56,58.3 60,58.2 60.6,85.2 56.6,85.3" fill="#8C4F1F"/>
    <polygon points="25,59 30,59 25,64" fill="#34333A"/>
    <polygon points="61,58.1 66,58 66.1,63" fill="#34333A"/>
    <polygon points="26,81 26,86 31,86" fill="#34333A"/>
    <polygon points="67,80 67,85 62,85.1" fill="#34333A"/>
    <polygon points="40,66 47,65.4 47.6,71 40.6,71.6" fill="#F1ECE2"/>
    <circle cx="32" cy="89" r="3.6" fill="#1E1D22" stroke="#8E959B" stroke-width="1.2"/><circle cx="32" cy="89" r="1.2" fill="#C3C8CD"/>
    <circle cx="60" cy="88.6" r="3.6" fill="#1E1D22" stroke="#8E959B" stroke-width="1.2"/><circle cx="60" cy="88.6" r="1.2" fill="#C3C8CD"/>

    <rect x="39.5" y="43" width="2.4" height="16" fill="#C3C8CD"/>
    <rect x="51.5" y="43" width="2.4" height="16" fill="#C3C8CD"/>
    <rect x="37.5" y="40.5" width="18" height="4" fill="#34333A"/>
    <polygon points="38,39 52,47 41,51" style="fill: var(--fish-pec, #E2CB3A)"/>
  </symbol>
</svg>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="weed-a" viewBox="0 0 30 150" preserveAspectRatio="none">
    <polygon points="12,150 19,150 23,124 27,98 20,72 25,46 19,20 15,0 10,22 5,48 12,74 5,100 9,126"/>
  </symbol>
  <symbol id="weed-b" viewBox="0 0 30 150" preserveAspectRatio="none">
    <polygon points="13,150 18,150 16,128 25,112 18,96 26,78 17,60 24,40 16,22 20,0 11,18 6,40 13,58 4,76 12,94 3,110 11,128"/>
  </symbol>
</svg>
<div class="card">
  <svg class="weed" style="left:20px;width:70px;height:300px" fill="#3B5A22"><use href="#weed-a"/></svg>
  <svg class="weed" style="left:85px;width:52px;height:210px" fill="#4A6F28"><use href="#weed-b"/></svg>
  <svg class="weed" style="left:1010px;width:60px;height:260px" fill="#2E4A1C"><use href="#weed-b"/></svg>
  <svg class="weed" style="left:1075px;width:76px;height:340px" fill="#4A6F28"><use href="#weed-a"/></svg>
  <svg class="weed" style="left:1140px;width:52px;height:220px" fill="#3B5A22"><use href="#weed-b"/></svg>

  <svg class="fish" viewBox="0 0 120 96"><use href="#fish-trip"/></svg>
  <h1>How much<br>leave?</h1>
</div></body></html>
